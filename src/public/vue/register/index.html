<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro con Vue</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/vue/register/style.css">
</head>
<body>
    <div id="register-app">
        <h1>Registrarse</h1>
        <p v-if="errorMsg" style="color: red;">{{ errorMsg }}</p>
        <form @submit.prevent="register">
            <label for="first_name">Nombre:</label>
            <input type="text" id="first_name" v-model="form.first_name":class="{ 'input-error': invalidFields.first_name }">
    
            <label for="last_name">Apellido:</label>
            <input type="text" id="last_name" v-model="form.last_name":class="{ 'input-error': invalidFields.last_name }">
    
            <label for="email">Email:</label>
            <input type="email" id="email" v-model="form.email":class="{ 'input-error': invalidFields.email }">
    
            <label for="password">Contraseña:</label>
            <input type="password" id="password" v-model="form.password":class="{ 'input-error': invalidFields.password }">
    
            <label for="age">Edad:</label>
            <input type="number" id="age" v-model="form.age":class="{ 'input-error': invalidFields.age }">
    
            <button type="submit">Registrarse</button>
            <a href="/login"> <button type="button">Volver al login</button> </a>
        </form>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- SweetAlert2 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> <!-- Vue.js CDN -->
    <script src="/vue/register/index.js"></script>
</body>
</html>
